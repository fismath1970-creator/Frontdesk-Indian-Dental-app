[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# SPA routing: /staff and /?q=... work on direct load and refresh.
# /api/* is served by netlify/functions/api.mts (config.path), which runs before this rule.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
